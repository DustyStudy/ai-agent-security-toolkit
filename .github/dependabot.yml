version: 2
updates:
  # The hash-pinned files in requirements/ are compiled as one consistent set by scripts/lock.py.
  # Dependabot would bump single transitive packages in isolation (for example pydantic-core while
  # pydantic pins it exactly) and leave the lock inconsistent, so it must not manage them. Refresh
  # them with `python scripts/lock.py --upgrade`. Security alerts are unaffected by this setting.
  - package-ecosystem: "pip"
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      pip:
        patterns: ["*"]
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"

  - package-ecosystem: "github-actions"

    cooldown:

      default-days: 7
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
    open-pull-requests-limit: 5

  # The Dockerfile's base image digest. Only the digest and patch releases: a new Python
  # minor (3.13 to 3.14) is a deliberate change, made once CI tests that version.
  - package-ecosystem: "docker"
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
