name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch/PR instead of letting them pile up.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow only reads the repo and installs from PyPI.
permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src tests

      - name: Ruff format check
        run: ruff format --check src tests

      - name: Mypy
        run: mypy src

      - name: Pytest
        run: pytest -v --cov=agentsec --cov-report=term-missing --cov-fail-under=90

  cross-platform:
    # The path-confinement and subprocess guards depend on OS path and process
    # semantics, and the package claims Windows and macOS support, so run the
    # suite there too. Kept separate from lint-and-test so that job's required
    # check names stay stable.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Pytest
        run: pytest -v

  package:
    # Catch packaging mistakes (missing data files, bad metadata) on every PR
    # instead of at release time.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Build sdist and wheel, check metadata
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Wheel contains the bundled threat catalog and py.typed
        run: |
          python - <<'PY'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          for needed in ("agentsec/py.typed", "agentsec/threatmodel/data/threats.yaml"):
              assert needed in names, f"missing from wheel: {needed}"
          PY

  toolkit-self-checks:
    # Dogfooding: the toolkit's own CLI validates its example assets and proves the
    # containment layers still hold against the reference simulator.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install -e .

      - name: Validate example tool policy (strict)
        run: agentsec policy validate --strict examples/policy.yaml

      - name: Example threat model is current
        run: |
          agentsec threatmodel render examples/support-copilot.system.yaml -o /tmp/tm.md
          diff -u docs/threat-model/EXAMPLE-support-copilot.md /tmp/tm.md

      - name: Containment regression - guarded reference agent must allow 0% tool misuse / exfil / prompt leak
        run: >
          agentsec fuzz --target builtin:guarded
          --categories tool_misuse,exfiltration,prompt_leak
          --max-asr 0 --quiet --json fuzz.json

      - name: Baseline sanity - naive reference agent must be fully compromised
        run: |
          agentsec fuzz --target builtin:naive --quiet --json naive.json
          python -c 'import json; d = json.load(open("naive.json")); assert d["asr"] == 1.0, d["asr"]'

      - name: Upload fuzz report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-report
          path: fuzz.json
          retention-days: 14
