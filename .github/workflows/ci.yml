name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch/PR instead of letting them pile up.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow only reads the repo and installs from PyPI.
permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev dependencies
        run: |
          python -m pip install --require-hashes -r requirements/requirements-dev.txt
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Ruff lint
        run: ruff check src tests fuzz scripts

      - name: Ruff format check
        run: ruff format --check src tests fuzz scripts

      - name: Mypy
        run: mypy src

      - name: Pytest
        run: >
          pytest -v --cov=agentsec --cov-report=term-missing --cov-fail-under=90
          --junitxml=reports/junit.xml --cov-report=xml:reports/coverage.xml
          --cov-report=html:reports/htmlcov

      - name: Test report (job summary and artifact)
        # The Pytest step above is the gate; this only renders what it wrote, so it never
        # fails the job itself.
        if: always()
        run: |
          python scripts/evidence_report.py --junit reports/junit.xml --coverage reports/coverage.xml \
            --title "Tests on Python ${PY_VERSION}" --md reports/summary.md --html reports/report.html || true
          if [ -f reports/summary.md ]; then cat reports/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
        env:
          PY_VERSION: ${{ matrix.python-version }}

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-report-py${{ matrix.python-version }}
          path: reports/
          if-no-files-found: ignore
          retention-days: 30

  cross-platform:
    # The path-confinement and subprocess guards depend on OS path and process
    # semantics, and the package claims Windows and macOS support, so run the
    # suite there too. Kept separate from lint-and-test so that job's required
    # check names stay stable.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev dependencies
        run: |
          python -m pip install --require-hashes -r requirements/requirements-dev.txt
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Pytest
        run: pytest -v

  package:
    # Catch packaging mistakes (missing data files, bad metadata) on every PR
    # instead of at release time.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Build sdist and wheel, check metadata
        run: |
          python -m pip install --require-hashes -r requirements/requirements-release-tools.txt
          python -m build --no-isolation  # same as release: backend from the hashed lock
          python -m twine check --strict dist/*

      - name: Wheel contains the bundled threat catalog and py.typed
        run: |
          python - <<'PY'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          for needed in ("agentsec/py.typed", "agentsec/threatmodel/data/threats.yaml"):
              assert needed in names, f"missing from wheel: {needed}"
          PY

  fuzz:
    # Coverage-guided fuzzing (Atheris/libFuzzer) of the security-critical parsers and
    # validators. The same targets also run as ordinary tests on a seed corpus and random
    # inputs (tests/test_fuzz_targets.py), so the invariants are enforced even without this job.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target: [cef, url, url_private, path, redact, scan, policy, guard, audit, exec_options, config]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Atheris and the package
        run: |
          python -m pip install --require-hashes -r requirements/requirements-fuzz.txt
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Fuzz ${{ matrix.target }} for 30 seconds
        run: |
          mkdir -p corpus crashes
          cp fuzz/corpus/${{ matrix.target }}/* corpus/
          python fuzz/run_fuzzer.py ${{ matrix.target }} corpus -max_total_time=30 -artifact_prefix=crashes/

      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: crashes/
          if-no-files-found: ignore

  locks:
    # The hash-pinned requirement files CI installs from must match pyproject.toml and the
    # .in files. Regenerate with `python scripts/lock.py`.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the pinned lock tooling
        run: python -m pip install --require-hashes -r requirements/requirements-lock-tools.txt

      - name: Requirement files are current
        run: |
          python scripts/lock.py
          git diff --exit-code -- requirements

  integrations:
    # Runs the tests that need optional third-party SDKs (skipped in the main matrix).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install with the optional SDKs
        run: |
          python -m pip install --require-hashes -r requirements/requirements-integrations.txt
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Integration tests (real MCP SDK, LangChain and LangGraph)
        run: pytest tests/test_integration_mcp.py tests/test_integration_langchain.py -v --no-cov

  toolkit-self-checks:
    # Dogfooding: the toolkit's own CLI validates its example assets and proves the
    # containment layers still hold against the reference simulator.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - run: |
          python -m pip install --require-hashes -r requirements/requirements-runtime.txt
          python -m pip install --require-hashes -r requirements/requirements-build.txt
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Validate example tool policy (strict)
        run: agentsec policy validate --strict examples/policy.yaml

      - name: Example threat model is current
        run: |
          agentsec threatmodel render examples/support-copilot.system.yaml -o /tmp/tm.md
          diff -u docs/threat-model/EXAMPLE-support-copilot.md /tmp/tm.md

      - name: Containment regression - guarded reference agent must allow 0% tool misuse / exfil / prompt leak
        run: >
          agentsec fuzz --target builtin:guarded
          --categories tool_misuse,exfiltration,prompt_leak
          --max-asr 0 --quiet --json fuzz.json

      - name: Containment regression - the same, with the payload delivered as a tool result
        run: >
          agentsec fuzz --target builtin:guarded --scenarios tool_result
          --categories tool_misuse,exfiltration,prompt_leak
          --max-asr 0 --quiet

      - name: Baseline sanity - naive reference agent must be fully compromised
        run: |
          agentsec fuzz --target builtin:naive --quiet --json naive.json
          python -c 'import json; d = json.load(open("naive.json")); assert d["asr"] == 1.0, d["asr"]'

      - name: Fuzz summary (job summary and HTML page)
        if: always()
        run: |
          python scripts/evidence_report.py --title "Simulator fuzz (containment gates)" \
            --fuzz "builtin:guarded (containment categories)=fuzz.json" \
            --fuzz "builtin:naive=naive.json" --md fuzz-summary.md --html fuzz-report.html || true
          if [ -f fuzz-summary.md ]; then cat fuzz-summary.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload fuzz report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-report
          path: |
            fuzz.json
            fuzz-report.html
          if-no-files-found: ignore
          retention-days: 14

  container:
    # The gateway image builds from the hash-pinned locks and serves /healthz as it should be
    # run: non-root, read-only root filesystem, no capabilities.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the image
        run: docker build -t agentsec-gateway:ci .

      - name: The example container config is valid inside the image
        run: >
          docker run --rm -v "$PWD/examples:/etc/agentsec:ro" agentsec-gateway:ci
          serve --config /etc/agentsec/gateway.container.yaml --check

      - name: Smoke test - hardened run answers /healthz and refuses a request without identity
        run: |
          docker run -d --name gateway --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /var/lib/agentsec:uid=10001,gid=10001,mode=0700 \
            -v "$PWD/examples:/etc/agentsec:ro" agentsec-gateway:ci \
            serve --config /etc/agentsec/gateway.container.yaml
          probe='
          import urllib.error, urllib.request
          base = "http://127.0.0.1:8443"
          assert urllib.request.urlopen(base + "/healthz").status == 200
          for host, expected in [("unlisted.example", 403), ("gateway.corp.example", 401)]:
              request = urllib.request.Request(base + "/v1/models", headers={"Host": host})
              try:
                  urllib.request.urlopen(request)
              except urllib.error.HTTPError as e:
                  assert e.code == expected, (host, e.code)
              else:
                  raise SystemExit(f"gateway unexpectedly served {host}")
          '
          ok=""
          for _ in $(seq 20); do
            if docker exec gateway python -c "$probe" 2>/dev/null; then ok=1; break; fi
            sleep 1
          done
          docker logs gateway
          test "$ok" = 1
          test "$(docker exec gateway id -u)" = 10001
          # `! cmd` is exempt from `set -e`, so assert explicitly.
          if docker exec gateway python -m pip --version; then echo "pip is present in the runtime image"; exit 1; fi
          docker exec gateway test -s /var/lib/agentsec/audit.jsonl
