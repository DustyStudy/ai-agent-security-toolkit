name: Container image

# On a release tag: builds the gateway image from that tag, pushes it to ghcr.io and attests
# its build provenance. Separate from release.yml so that a registry problem cannot hold up
# the PyPI release.
#
# Tag pushes only, on purpose. A manual run would execute the workflow file of whatever
# branch it was started from, with permission to publish under a release version, and its
# provenance would name that branch instead of the tag the image was built from.
#
# If a run fails after the push but before the attestation, the version tag exists without
# provenance and a re-run stops at the "already published" check. Delete that package
# version on GitHub (Packages, the image, Manage versions), then re-run the failed job.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

# One build per tag at a time; never cancel a push half way.
concurrency:
  group: image-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # sign the provenance attestation
      attestations: write # store it
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Harden Runner
        # The endpoints the v0.8.1 run reached, plus three it did not but a later run may:
        # Docker Hub's other blob CDN (production.cloudflare.docker.com), ghcr.io's blob host
        # (pkg-containers.githubusercontent.com) and Sigstore's timestamp authority. A re-run
        # uses the workflow file of the tag, so a host missing here cannot be added for a
        # release that has already been tagged: the harden-runner log names what was blocked.
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            registry-1.docker.io:443
            auth.docker.io:443
            production.cloudfront.docker.com:443
            production.cloudflare.docker.com:443
            pypi.org:443
            files.pythonhosted.org:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            timestamp.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            tuf-repo.github.com:443

      - name: The tag is a release tag
        # The trigger's glob also matches names such as v1.2.3-rc1 or v1.2.3.4.
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::not a release tag: $TAG"
            exit 1
          fi
          {
            echo "VERSION=${TAG#v}"
            echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}"  # registry names are lowercase
          } >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag matches the package version
        run: |
          python3 - <<'PY'
          import os, tomllib
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          assert os.environ["VERSION"] == version, f"tag v{os.environ['VERSION']} does not match pyproject version {version}"
          PY

      - name: Build the image
        run: |
          docker build --pull \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --label "org.opencontainers.image.licenses=MIT" \
            -t "${IMAGE}:${VERSION}" .

      - name: The image runs the tagged version
        run: |
          docker run --rm -v "$PWD/examples:/etc/agentsec:ro" "${IMAGE}:${VERSION}" \
            serve --config /etc/agentsec/gateway.container.yaml --check
          installed="$(docker run --rm --entrypoint python "${IMAGE}:${VERSION}" -c 'import agentsec; print(agentsec.__version__)')"
          test "$installed" = "$VERSION"

      - name: Scan the built image before publication
        run: |
          bash scripts/install-trivy.sh
          "$RUNNER_TEMP/trivy" image --image-src docker --scanners vuln --severity HIGH,CRITICAL \
            --db-repository ghcr.io/aquasecurity/trivy-db:2 --exit-code 1 "${IMAGE}:${VERSION}"

      - name: Push to ghcr.io
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          # A version tag is published once: a re-run must not replace an image people may
          # already have pulled and verified. Only a registry answer that says "no such
          # manifest" lets the push go ahead; any other failure (network, auth) stops here,
          # because it does not show the tag is free.
          if found="$(docker manifest inspect "${IMAGE}:${VERSION}" 2>&1)"; then
            echo "::error::${IMAGE}:${VERSION} is already published"
            exit 1
          elif ! grep -qiE 'manifest unknown|name unknown|no such manifest' <<< "$found"; then
            echo "::error::cannot tell whether ${IMAGE}:${VERSION} is published: ${found}"
            exit 1
          fi
          docker push "${IMAGE}:${VERSION}"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "${IMAGE}:${VERSION}")"
          echo "digest=${digest#*@}" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: The published image verifies
        # The same check docs/GATEWAY.md gives users: built by this workflow, from this tag.
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          gh attestation verify "oci://${IMAGE}@${DIGEST}" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/image.yml" \
            --source-ref "refs/tags/${TAG}"
          {
            echo "Published \`${IMAGE}:${VERSION}\`"
            echo
            echo "Digest: \`${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
