name: Release

# Push a tag like v0.1.0 to build the package, generate an SBOM, attest build
# provenance, publish a GitHub Release with the artifacts attached, and then upload
# the wheel and sdist to PyPI with trusted publishing (OIDC, no stored API token).
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        # Same allowlists as grc-evidence-automation's release workflow, which runs the
        # same steps. This only runs on a tag push, so a PR cannot exercise it: if a
        # release fails on a blocked call, the harden-runner log names the endpoint.
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            pypi.org:443
            files.pythonhosted.org:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, tomllib
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          tag = os.environ["TAG"].removeprefix("v")
          assert tag == version, f"tag v{tag} does not match pyproject version {version}"
          PY

      - name: Build sdist and wheel, check metadata
        run: |
          python -m pip install --require-hashes -r requirements/requirements-release-tools.txt
          python -m build --no-isolation  # backend comes from the hashed lock above
          python -m twine check --strict dist/*

      - name: Generate CycloneDX SBOM of the installed wheel
        # A clean venv holding only the wheel and its runtime dependencies, so the
        # SBOM does not include build or SBOM tooling.
        run: |
          python -m venv sbom-env
          sbom-env/bin/python -m pip install --require-hashes -r requirements/requirements-runtime.txt
          sbom-env/bin/python -m pip install --no-deps dist/*.whl
          cyclonedx-py environment --of JSON -o dist/sbom.cdx.json sbom-env/bin/python

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release
      id-token: write # sign the provenance attestation
      attestations: write # store it
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            uploads.github.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Attach the attestation bundle to the release
        # Scorecard and offline verifiers look for a signature or provenance file next to the
        # artifacts. The bundle covers every artifact above; prove it verifies them before it ships.
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          base="${GITHUB_REPOSITORY#*/}-${TAG}"
          cp "$BUNDLE" "dist/${base}.intoto.jsonl"
          head -n 1 "$BUNDLE" > "dist/${base}.sigstore.json"
          for f in dist/*.whl dist/*.tar.gz dist/sbom.cdx.json; do
            gh attestation verify "$f" --bundle "dist/${base}.sigstore.json" --repo "$GITHUB_REPOSITORY"
          done

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag

  pypi:
    # Trusted publishing: PyPI exchanges this job's OIDC token for a short-lived upload
    # token, so no PyPI credential is stored in the repository. It runs after `release`,
    # so a version only reaches PyPI once its provenance attestation has verified, and
    # the `pypi` environment is where a required reviewer can gate the upload.
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/ai-agent-security-toolkit/
    permissions:
      id-token: write # mint the PyPI upload token and sign the PEP 740 attestations
    steps:
      - name: Harden Runner
        # The publish action pulls its container image from ghcr.io inside the step.
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            pypi.org:443
            upload.pypi.org:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            timestamp.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Keep only the wheel and sdist
        # The artifact also holds the SBOM, which PyPI would reject as an upload.
        run: |
          mkdir pypi-dist
          mv dist/*.whl dist/*.tar.gz pypi-dist/
          ls -l pypi-dist

      - name: Publish to PyPI
        # Known limit: the action runs ghcr.io/pypa/gh-action-pypi-publish:<this commit>, a
        # tag rather than an image digest, so PyPA could repoint it without this pin
        # changing. Accepted: the same maintainers control the pinned action code, and a
        # fork pinned by digest would be more code to keep current than it protects.
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: pypi-dist/
