[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-security-toolkit"
version = "0.1.0"
description = "Security toolkit for LLM agents: prompt-injection fuzzer, tool-call allowlist/sandbox, output validation + tamper-evident audit logging, and a STRIDE-for-agents threat-modeling template."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Dusty" }]
keywords = ["llm", "agents", "prompt-injection", "security", "red-team", "sandbox", "audit", "threat-modeling"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "PyYAML>=6.0",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
mcp = ["mcp>=2"]
langchain = ["langchain-core>=0.3"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "types-jsonschema>=4.20",
]

[project.urls]
Homepage = "https://github.com/DustyStudy/ai-agent-security-toolkit"
Issues = "https://github.com/DustyStudy/ai-agent-security-toolkit/issues"
Changelog = "https://github.com/DustyStudy/ai-agent-security-toolkit/blob/main/CHANGELOG.md"
Security = "https://github.com/DustyStudy/ai-agent-security-toolkit/security/policy"

[project.scripts]
agentsec = "agentsec.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentsec = ["py.typed", "threatmodel/data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["agentsec"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
# Deliberately-vulnerable simulator + attack corpus: fake credentials and
# canary strings are the point of these files.
"src/agentsec/fuzzer/mock_agents.py" = ["S105", "S106"]

[tool.mypy]
python_version = "3.11"
packages = ["agentsec"]
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_untyped_defs = true
