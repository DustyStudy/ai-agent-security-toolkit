# Names for the external framework identifiers used in threats.yaml.
# A test checks that every identifier referenced by the catalog is listed here.
owasp_agentic:
  title: "OWASP Top 10 for Agentic Applications (2026)"
  source: "https://genai.owasp.org/2025/12/09/owasp-top-10-for-agentic-applications-the-benchmark-for-agentic-security-in-the-age-of-autonomous-ai/"
  items:
    ASI01: "Agent Goal Hijack"
    ASI02: "Tool Misuse"
    ASI03: "Identity & Privilege Abuse"
    ASI04: "Agentic Supply Chain Vulnerabilities"
    ASI05: "Unexpected Code Execution"
    ASI06: "Memory & Context Poisoning"
    ASI07: "Insecure Inter-Agent Communication"
    ASI08: "Cascading Failures"
    ASI09: "Human-Agent Trust Exploitation"
    ASI10: "Rogue Agents"
